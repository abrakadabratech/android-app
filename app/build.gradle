    implementation 'com.github.denzcoskun:ImageSlideshow:0.1.0'

    //Event Bus
    implementation("org.greenrobot:eventbus:3.3.1")

    //Flexible Switch
    implementation 'com.github.codersrouteandroid:flexible-switch:1.0'

