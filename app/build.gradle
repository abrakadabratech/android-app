plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'

    id 'com.google.firebase.crashlytics'
    //    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'com.google.gms.google-services'

}

android {
    compileSdk 34

    lint {
        baseline = file("lint-baseline.xml")
    }
    buildFeatures {
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.4"
    }

    defaultConfig {
        applicationId "com.oss.abraakadabraaapp"
        minSdk 23
        targetSdk 33
        
        versionCode 38
        versionName "1.20.1"
//        versionName "test_refresh_product"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('D:\\Android\\AndroidProjects\\MY_WORK_PROJECTS\\newJksFiles\\key.jks')
//            storeFile file('/Users/hari/Desktop/Freelancing/Code/AKD/akd-app-v2/key/key.jks')
            storePassword 'akd@123'
            keyAlias 'key0'
            keyPassword 'akd@123'
        }
        release {
            storeFile file("D:\\Android\\AndroidProjects\\MY_WORK_PROJECTS\\newJksFiles\\key.jks")
//            storeFile file('/Users/hari/Desktop/Freelancing/Code/AKD/akd-app-v2/key/key.jks')
            storePassword "akd@123"
            keyAlias "key0"
            keyPassword "akd@123"
        }
    }
    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            //NEW_PROD_URL
//            buildConfigField("String", "BASE_URL", "\"https://api.abrakadabraapp.app/\"")
//            buildConfigField("String", "BASE_DEMO", "\"https://api.abrakadabraapp.app/\"")

            buildConfigField("String", "BASE_URL", "\"https://api.abra-ka-dabra.com/\"")
            buildConfigField("String", "BASE_DEMO", "\"https://api.abra-ka-dabra.com/\"")

            buildConfigField "String", "API_KEY", "\"${project.property('API_KEY')}\""
            signingConfig signingConfigs.release

        }
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
//            buildConfigField("String", "BASE_URL", "\"https://abrakadabraapp.app/app/api/v1/\"")

//            buildConfigField("String", "BASE_URL", "\"https://asia-south1-abrakadabra-dev.cloudfunctions.net/api/\"")
//            buildConfigField("String", "BASE_DEMO", "\"https://asia-south1-abrakadabra-dev.cloudfunctions.net/api/\"")
            buildConfigField("String", "BASE_URL", "\"https://abrakadabra-dev.el.r.appspot.com/\"")
            buildConfigField("String", "BASE_DEMO", "\"https://abrakadabra-dev.el.r.appspot.com/\"")



            buildConfigField "String", "API_KEY", "\"${project.property('API_KEY')}\""

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.oss.abraakadabraaapp'
}

dependencies {
    implementation project(':ucrop')

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.2'
    implementation 'com.google.firebase:firebase-common-ktx:20.2.0'
    implementation 'com.google.firebase:firebase-auth-ktx:21.1.0'
    implementation 'androidx.paging:paging-common-ktx:3.1.1'
    implementation 'androidx.paging:paging-runtime-ktx:3.1.1'
    implementation 'com.google.firebase:firebase-crashlytics-ktx:18.3.4'
    implementation 'androidx.databinding:databinding-common:8.2.2'
    implementation 'androidx.databinding:databinding-runtime:8.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    //material
    implementation 'com.google.android.material:material:1.6.1'

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2"

    //glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
